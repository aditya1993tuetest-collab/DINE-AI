apiVersion: apps/v1
kind: Deployment
metadata: {name: nextleap-api}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: nextleap-api}}
  template:
    metadata: {labels: {app: nextleap-api}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: ghcr.io/example/nextleap-api@sha256:REPLACE_BY_PIPELINE
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: nextleap-api}}, {secretRef: {name: nextleap-api}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          readinessProbe: {httpGet: {path: /health/ready, port: 8000}, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /health/live, port: 8000}, periodSeconds: 15, failureThreshold: 3}
          lifecycle: {preStop: {exec: {command: ["sh", "-c", "sleep 5"]}}}
---
apiVersion: v1
kind: Service
metadata: {name: nextleap-api}
spec: {selector: {app: nextleap-api}, ports: [{port: 80, targetPort: 8000}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: nextleap-web}
spec:
  replicas: 2
  selector: {matchLabels: {app: nextleap-web}}
  template:
    metadata: {labels: {app: nextleap-web}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: web
          image: ghcr.io/example/nextleap-web@sha256:REPLACE_BY_PIPELINE
          ports: [{containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 128Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: nextleap-web}
spec: {selector: {app: nextleap-web}, ports: [{port: 80, targetPort: 8080}]}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: nextleap-api}
spec: {minAvailable: 1, selector: {matchLabels: {app: nextleap-api}}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: nextleap-api}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: nextleap-api}
  minReplicas: 2
  maxReplicas: 10
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}}]
---
apiVersion: batch/v1
kind: Job
metadata: {name: nextleap-migrate}
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/example/nextleap-api@sha256:REPLACE_BY_PIPELINE
          command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
          envFrom: [{secretRef: {name: nextleap-migration}}]
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, capabilities: {drop: [ALL]}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: nextleap-api-egress}
spec:
  podSelector: {matchLabels: {app: nextleap-api}}
  policyTypes: [Ingress, Egress]
  ingress: [{from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}}], ports: [{port: 8000}]}]
  egress:
    - to: [{namespaceSelector: {matchLabels: {name: data}}}]
      ports: [{port: 5432}, {port: 6379}]
    - to: [{ipBlock: {cidr: 0.0.0.0/0}}]
      ports: [{port: 443}]
