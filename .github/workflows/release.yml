name: Release
on:
  push: {tags: ["v*"]}
permissions: {contents: read, packages: write, id-token: write}
jobs:
  build:
    runs-on: ubuntu-latest
    outputs: {api_digest: "${{ steps.api.outputs.digest }}", web_digest: "${{ steps.web.outputs.digest }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: api
        uses: docker/build-push-action@v6
        with: {context: ., file: apps/api/Dockerfile, push: true, tags: "ghcr.io/${{ github.repository_owner }}/nextleap-api:${{ github.ref_name }}"}
      - id: web
        uses: docker/build-push-action@v6
        with: {context: ., file: apps/web/Dockerfile, push: true, tags: "ghcr.io/${{ github.repository_owner }}/nextleap-web:${{ github.ref_name }}"}
  staging:
    needs: build
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/deploy.sh staging '${{ needs.build.outputs.api_digest }}' '${{ needs.build.outputs.web_digest }}'
        env: {KUBE_CONFIG_DATA: "${{ secrets.KUBE_CONFIG_DATA }}"}
  production:
    needs: [build, staging]
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/deploy.sh production '${{ needs.build.outputs.api_digest }}' '${{ needs.build.outputs.web_digest }}'
        env: {KUBE_CONFIG_DATA: "${{ secrets.KUBE_CONFIG_DATA }}"}
