name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nextleap_test
          POSTGRES_USER: nextleap
          POSTGRES_PASSWORD: nextleap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextleap -d nextleap_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://nextleap:nextleap@localhost:5432/nextleap_test
      TEST_DATABASE_URL: postgresql+psycopg://nextleap:nextleap@localhost:5432/nextleap_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API and development tools
        run: python -m pip install -e "apps/api[dev]"
      - name: Lint
        run: python -m ruff check apps/api
      - name: Format check
        run: python -m ruff format --check apps/api
      - name: Type check
        run: python -m mypy apps/api/src apps/api/tests
      - name: Verify migrations
        working-directory: apps/api
        run: python -m alembic upgrade head
      - name: Test
        run: python -m pytest apps/api/tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Install browser for E2E tests
        run: npx playwright install --with-deps chromium
      - name: Browser and accessibility tests
        run: npm run test:e2e

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject committed secrets and oversized files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "A secret-bearing environment file is tracked."
            exit 1
          fi
          oversized="$(find . -type f -not -path './.git/*' -size +1M -print)"
          if [ -n "$oversized" ]; then
            echo "Files larger than 1 MiB must not be committed:"
            echo "$oversized"
            exit 1
          fi
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Python dependency audit
        run: python -m pip install pip-audit ./apps/api && pip-audit
      - name: Web production dependency audit
        working-directory: apps/web
        run: npm ci && npm audit --omit=dev --audit-level=high
      - name: Build images
        run: docker build -f apps/api/Dockerfile -t nextleap-api:ci . && docker build -f apps/web/Dockerfile -t nextleap-web:ci .
      - name: API container vulnerability scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: nextleap-api:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Web container vulnerability scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: nextleap-web:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: nextleap-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: nextleap-sbom
          path: nextleap-sbom.cdx.json
