services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nextleap
      POSTGRES_USER: nextleap
      POSTGRES_PASSWORD: nextleap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextleap -d nextleap"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql+psycopg://nextleap:nextleap@postgres:5432/nextleap
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      RUN_MIGRATIONS: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:8080"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
