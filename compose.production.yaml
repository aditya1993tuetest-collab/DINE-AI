services:
  api:
    restart: unless-stopped
    environment:
      APP_ENV: production
      REDIS_REQUIRED: "true"
      TRUSTED_HOSTS: ${PUBLIC_HOSTNAME}
      WEB_ORIGIN: https://${PUBLIC_HOSTNAME}
    secrets:
      - database_url
      - source: groq_api_key
        target: llm_api_key
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: []

  web:
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["8080:8080"]

  postgres:
    ports: []
    restart: unless-stopped

  redis:
    ports: []
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]

secrets:
  database_url:
    external: true
  groq_api_key:
    external: true
