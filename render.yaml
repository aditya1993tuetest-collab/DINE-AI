services:
  - type: web
    name: nextleap-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_HOST
        value: 0.0.0.0
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: nextleap-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nextleap-cache
          property: connectionString
      - key: REDIS_REQUIRED
        value: "true"
      - key: WEB_ORIGIN
        fromService:
          type: web
          name: nextleap-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: TRUSTED_HOSTS
        fromService:
          type: web
          name: nextleap-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: DATABASE_POOL_SIZE
        value: "3"
      - key: DATABASE_MAX_OVERFLOW
        value: "2"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false
      - key: LLM_REASONING_EFFORT
        value: low
      - key: MAX_LLM_CANDIDATES
        value: "12"
      - key: MAX_LLM_OUTPUT_TOKENS
        value: "700"

  - type: web
    name: nextleap-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: nextleap-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_API_TIMEOUT_MS
        value: "20000"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: default-src 'self'; connect-src 'self' https:; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: keyvalue
    name: nextleap-cache
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: "off"

databases:
  - name: nextleap-postgres
    plan: free
    region: singapore
    databaseName: nextleap
    user: nextleap
    postgresMajorVersion: "17"
