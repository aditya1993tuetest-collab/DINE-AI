[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nextleap-restaurant-api"
version = "0.5.0"
description = "Grounded restaurant recommendation API"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "opentelemetry-exporter-otlp-proto-http>=1.29,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1.0",
  "opentelemetry-instrumentation-sqlalchemy>=0.50b0,<1.0",
  "opentelemetry-sdk>=1.29,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.7,<3.0",
  "redis>=5.2,<7.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.scripts]
nextleap-data = "restaurant_recommender.ingestion.cli:main"
nextleap-load = "restaurant_recommender.load_test:main"

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100,<7.0",
  "mypy>=1.14,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/restaurant_recommender"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=restaurant_recommender --cov-report=term-missing --cov-fail-under=90"
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL through TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
omit = [
  "src/restaurant_recommender/load_test.py",
  "src/restaurant_recommender/ingestion/cli.py",
  "src/restaurant_recommender/ingestion/adapters.py",
]
